<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Nova Shift">
  <!-- Nova Shift ships no favicon of its own, so this is a mark rather than a
       scaled-up placeholder. It is drawn in NEUTRAL greys on the product's own
       near-black, deliberately: it is our redraw, not the client's identity,
       and painting it in the studio accent would put NovaFaber's teal on a
       client's logo — which is the one colour on this page that has to mean
       "NovaFaber" and nothing else. -->
  <defs>
    <linearGradient id="ns" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26262c"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#ns)"/>
  <path d="M22 96V32h10l30 44V32h10v64H62L32 52v44z" fill="#f2f0ed"/>
  <path d="M84 96c-8 0-14-4-16-11l9-3c1 4 4 6 8 6 4 0 6-2 6-5 0-9-21-4-21-19 0-9 7-14 16-14 8 0 13 4 15 10l-9 3c-1-3-3-5-7-5s-6 2-6 5c0 8 21 3 21 19 0 9-7 14-16 14z" fill="#8d8b88"/>
</svg>
