<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="A25">
  <!--
    A25's mark, redrawn at vector — the same treatment KD Law's and Sneaker
    Air's marks already get in this directory.

    The shipped asset was a 92 KB JPEG at 1600px: the only raster mark on the
    homepage logo strip, sitting next to three SVGs, and it showed —
    compression fringing around the white linework, and soft edges wherever
    the tile scaled past its native size.

    This is that artwork traced rather than reinterpreted: the JPEG's flat
    two-colour geometry thresholded, despeckled, boundary-walked and
    Douglas-Peucker simplified, so every edge, the open ring and the offset
    chevrons of the A are the client's own construction to within a third of
    a pixel. Ground colour sampled from the original: #0f0740.

    ~25x smaller than the JPEG, resolution-independent, and crisp on the
    retina tiles where the raster went soft.
  -->
